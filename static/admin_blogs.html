<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Blog Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060a14;--card:#0f1525;--border:#1a2035;--text:#e2e8f0;--muted:#64748b;--accent:#7c3aed;--accent2:#06b6d4;--danger:#ef4444;--success:#22c55e}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent2);text-decoration:none}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:400px;text-align:center}
.login-card h1{font-size:28px;font-weight:900;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-card .sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.field{margin-bottom:20px;text-align:left}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;transition:border .2s}
.field input:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(124,58,237,.3)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#252d45}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn-icon{padding:8px;border-radius:8px;background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-icon:hover{color:var(--text);border-color:#3a4565}
.error-msg{color:var(--danger);font-size:13px;margin-top:12px;display:none}

/* Dashboard */
.dash{display:none;max-width:900px;margin:0 auto;padding:32px 20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.topbar h1{font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;gap:10px;align-items:center}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* Editor */
.editor-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:28px}
.editor-section h2{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-row.full{grid-template-columns:1fr}
.field textarea{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:'JetBrains Mono',monospace;line-height:1.7;min-height:320px;resize:vertical;transition:border .2s}
.field textarea:focus{outline:none;border-color:var(--accent)}
.editor-actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transform:translateX(120%);transition:transform .3s ease}
.toast.show{transform:translateX(0)}
.toast.success{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.25)}
.toast.error{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.25)}

/* Preview */
.preview-toggle{display:flex;gap:0;margin-bottom:16px;background:var(--bg);border-radius:8px;padding:3px;width:fit-content}
.preview-toggle button{padding:6px 16px;border:none;border-radius:6px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s}
.preview-toggle button.active{background:var(--accent);color:#fff}
.preview-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:24px;min-height:200px;display:none;font-size:14px;line-height:1.8}
.preview-box h1,.preview-box h2,.preview-box h3{color:#fff;margin:16px 0 8px}
.preview-box h1{font-size:22px}
.preview-box h2{font-size:18px}
.preview-box h3{font-size:15px}
.preview-box p{margin-bottom:12px;color:#cbd5e1}
.preview-box strong{color:#fff}
.preview-box em{color:var(--accent2)}
.preview-box code{background:rgba(124,58,237,.12);padding:2px 7px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
.preview-box pre{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto}
.preview-box pre code{background:none;padding:0}
.preview-box ul,.preview-box ol{margin:8px 0 12px 20px;color:#cbd5e1}
.preview-box li{margin-bottom:4px}
.preview-box blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--muted);margin:12px 0;font-style:italic}
.preview-box a{color:var(--accent2);text-decoration:underline}
.preview-box hr{border:none;border-top:1px solid var(--border);margin:16px 0}

/* Post list */
.post-list h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.post-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:border .2s}
.post-item:hover{border-color:#2a3555}
.post-info{flex:1;min-width:0}
.post-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:12px;align-items:center}
.post-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:16px}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .emoji{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px}

/* Responsive */
@media(max-width:640px){
  .stats-row{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .post-item{flex-direction:column;align-items:flex-start;gap:12px}
  .post-actions{margin-left:0}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <h1>✦ Blog Admin</h1>
    <p class="sub">Enter your admin token to manage posts</p>
    <div class="field">
      <label>Admin Token</label>
      <input type="password" id="tokenInput" placeholder="Paste your token here" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dashView">
  <div class="topbar">
    <h1>✦ Blog Manager</h1>
    <div class="topbar-right">
      <a href="/" class="btn btn-icon" title="View site">🌐</a>
      <button class="btn btn-sm btn-secondary" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total Posts</div></div>
    <div class="stat-card"><div class="stat-num" id="statTags">0</div><div class="stat-label">Unique Tags</div></div>
    <div class="stat-card"><div class="stat-num" id="statLatest">—</div><div class="stat-label">Latest Post</div></div>
  </div>

  <!-- Editor -->
  <div class="editor-section">
    <h2>📝 <span id="editorTitle">New Post</span></h2>
    <div class="form-row">
      <div class="field">
        <label>Title</label>
        <input type="text" id="postTitle" placeholder="My awesome blog post">
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="postTags" placeholder="keam, python, iot">
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Content (Markdown)</label>
        <div class="preview-toggle">
          <button class="active" onclick="showTab('write')">Write</button>
          <button onclick="showTab('preview')">Preview</button>
        </div>
        <textarea id="postContent" placeholder="# Hello World&#10;&#10;Write your post in **Markdown**...&#10;&#10;- Lists work&#10;- Code blocks work&#10;- Bold, italic, links all work"></textarea>
        <div class="preview-box" id="previewBox"></div>
      </div>
    </div>
    <div class="editor-actions">
      <button class="btn btn-primary" style="width:auto" onclick="publishPost()" id="publishBtn">Publish</button>
      <button class="btn btn-secondary btn-sm" onclick="clearEditor()" id="cancelBtn" style="display:none">Cancel Edit</button>
      <span style="font-size:12px;color:var(--muted)" id="editorHint">Markdown supported: **bold**, *italic*, `code`, # headings</span>
    </div>
  </div>

  <!-- Post List -->
  <div class="post-list">
    <h2>📚 Published Posts</h2>
    <div id="postList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let TOKEN = localStorage.getItem('blog_admin_token') || '';
let editingId = null;

// --- Auth ---
function doLogin() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  TOKEN = t;
  localStorage.setItem('blog_admin_token', TOKEN);
  verifyAndShow();
}

function doLogout() {
  TOKEN = '';
  localStorage.removeItem('blog_admin_token');
  document.getElementById('dashView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
}

async function verifyAndShow() {
  try {
    const res = await fetch('/api/blogs', { headers: authHeaders() });
    if (res.status === 401) { showErr('Invalid token'); return; }
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    loadPosts();
  } catch(e) { showErr('Cannot reach server'); }
}

function showErr(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }; }

// --- Posts ---
async function loadPosts() {
  try {
    const res = await fetch('/api/blogs');
    const posts = await res.json();
    const list = document.getElementById('postList');

    // Stats
    document.getElementById('statTotal').textContent = posts.length;
    const allTags = new Set();
    posts.forEach(p => (p.tags || []).forEach(t => allTags.add(t)));
    document.getElementById('statTags').textContent = allTags.size;
    if (posts.length > 0) {
      const d = new Date(posts[0].created_at);
      document.getElementById('statLatest').textContent = d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
    }

    if (!posts.length) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">📝</div><p>No posts yet. Write your first one above!</p></div>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <div class="post-item">
        <div class="post-info">
          <div class="post-title">${esc(p.title)}</div>
          <div class="post-meta">
            <span>${new Date(p.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
            <span>·</span>
            <span>${p.read_time || '3 min read'}</span>
            ${(p.tags||[]).map(t => `<span style="background:rgba(124,58,237,.12);padding:2px 8px;border-radius:20px;font-size:11px;color:var(--accent)">${esc(t)}</span>`).join('')}
          </div>
        </div>
        <div class="post-actions">
          <button class="btn btn-sm btn-secondary" onclick="editPost('${p.id}')">✏️ Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deletePost('${p.id}','${esc(p.title)}')">🗑️</button>
        </div>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

async function publishPost() {
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  const tags = document.getElementById('postTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if (!title || !content) { toast('Title and content are required', 'error'); return; }

  const btn = document.getElementById('publishBtn');
  btn.textContent = editingId ? 'Updating...' : 'Publishing...';
  btn.disabled = true;

  try {
    let res;
    if (editingId) {
      res = await fetch('/api/blogs/' + editingId, { method:'PUT', headers:authHeaders(), body: JSON.stringify({title, content, tags}) });
    } else {
      res = await fetch('/api/blogs', { method:'POST', headers:authHeaders(), body: JSON.stringify({title, content, tags}) });
    }
    if (!res.ok) { const e = await res.json(); toast(e.error || 'Failed', 'error'); return; }
    toast(editingId ? 'Post updated!' : 'Published!', 'success');
    clearEditor();
    loadPosts();
  } catch(e) { toast('Network error', 'error'); }
  finally { btn.textContent = 'Publish'; btn.disabled = false; }
}

async function deletePost(id, title) {
  if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
  try {
    await fetch('/api/blogs/' + id, { method:'DELETE', headers:authHeaders() });
    toast('Post deleted', 'success');
    if (editingId === id) clearEditor();
    loadPosts();
  } catch(e) { toast('Failed to delete', 'error'); }
}

async function editPost(id) {
  try {
    const res = await fetch('/api/blogs');
    const posts = await res.json();
    const post = posts.find(p => p.id === id);
    if (!post) return;
    editingId = id;
    document.getElementById('postTitle').value = post.title;
    document.getElementById('postContent').value = post.content;
    document.getElementById('postTags').value = (post.tags || []).join(', ');
    document.getElementById('editorTitle').textContent = 'Edit Post';
    document.getElementById('publishBtn').textContent = 'Update';
    document.getElementById('cancelBtn').style.display = 'inline-flex';
    document.getElementById('editorHint').textContent = 'Editing: ' + post.title;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) { toast('Failed to load post', 'error'); }
}

function clearEditor() {
  editingId = null;
  document.getElementById('postTitle').value = '';
  document.getElementById('postContent').value = '';
  document.getElementById('postTags').value = '';
  document.getElementById('editorTitle').textContent = 'New Post';
  document.getElementById('publishBtn').textContent = 'Publish';
  document.getElementById('cancelBtn').style.display = 'none';
  document.getElementById('editorHint').textContent = 'Markdown supported: **bold**, *italic*, `code`, # headings';
  showTab('write');
}

// --- Markdown Preview ---
function showTab(tab) {
  const btns = document.querySelectorAll('.preview-toggle button');
  const textarea = document.getElementById('postContent');
  const preview = document.getElementById('previewBox');
  btns.forEach(b => b.classList.remove('active'));
  if (tab === 'write') {
    btns[0].classList.add('active');
    textarea.style.display = 'block';
    preview.style.display = 'none';
  } else {
    btns[1].classList.add('active');
    textarea.style.display = 'none';
    preview.innerHTML = renderMd(textarea.value);
    preview.style.display = 'block';
  }
}

function renderMd(src) {
  let html = esc(src);
  // Code blocks (```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // HR
  html = html.replace(/^---$/gm, '<hr>');
  // Unordered list
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Paragraphs (double newline)
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/\n/g, '<br>');
  return html;
}

// --- Utils ---
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// --- Init ---
if (TOKEN) verifyAndShow();
</script>
</body>
</html>
